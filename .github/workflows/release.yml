name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.7.2

            Brings the desktop app up to the 0.7.2 feature set of the upstream project, keeping this fork's own layers (project-tree sidebar, full-height layout, desktop translations, settings sections).

            ### Added

            - **Artifacts and inline previews**: complete HTML/SVG/React fences render in a sandboxed frame (Source / full screen / download), `:::artifact` blocks become message cards and side-panel tabs with versions per identifier, and React components compile against a bundled runtime — so a component that only uses React works offline.
            - **Scheduled tasks**: a Scheduled page with cron schedules, a read-only default, run history and completion notifications.
            - **Conversation sidebar**: relative times, hover actions in a fixed trailing slot, collapsed project counts, and a mobile drawer that remembers the desktop state.
            - **Model switches by scope**: enable models per provider or model, refresh provider catalogs on demand, and see classifier/image models separately; costs can be shown in CNY with a live exchange rate.
            - **Desktop**: autostart switch, timestamped log files with an "Open logs" button, a "Clear cache" action, Finder "Open With", window size/position restore, and macOS vibrancy.

            ### Changed

            - The settings dialog follows the host platform (macOS preferences toolbar, Windows/Linux left navigation) and ⌘, / Ctrl+, opens it at the last section.
            - The composer is one card: round Send whose fill is the ready signal, attach as a leading "+", bash/steer tints on the card itself, and one menu for reasoning and tools. Manual compaction moved into the session menu.
            - The file panel is a full-height workbench beside the chat, with the file tree as its left column, the window controls in its header while open, and `\` to close it.

            ### Fixed

            - The app no longer loses the panel state or the composer focus when the window is resized across breakpoints.
            - A test file left out of `npm test` now fails the suite, so a new test directory cannot go unnoticed.

            Bundled components: pi 1.3.0, pi-web 0.10.0.

            ---

            ## Pi Agent Desktop 0.7.2

            把桌面端对齐到上游 0.7.2 的功能集，同时保留本分支自己的层次（项目树侧栏、整高布局、桌面端三语翻译、分区设置）。

            ### 新增

            - **Artifacts 与内联预览**：完整的 HTML/SVG/React 围栏在沙箱中渲染（源码 / 全屏 / 下载），`:::artifact` 块变成消息卡片与侧栏页签，并按标识符记录版本；React 组件用随包附带的运行时编译，只依赖 React 的组件离线也能运行。
            - **定时任务**：定时任务页支持 cron、默认只读、运行历史与完成通知。
            - **会话侧栏**：相对时间、悬停操作固定在行尾槽位、折叠时显示项目会话数，手机抽屉会记住桌面端的展开状态。
            - **按范围开关模型**：可按供应商或单个模型启用，按需刷新供应商目录，单独列出分类器/图像模型；费用可按实时汇率以人民币显示。
            - **桌面端**：开机自启开关、带时间戳的日志与「打开日志」按钮、「清除缓存」、Finder「打开方式」、窗口大小与位置恢复，以及 macOS 毛玻璃效果。

            ### 变更

            - 设置窗口跟随宿主平台（macOS 偏好设置工具栏、Windows/Linux 左侧导航），⌘, / Ctrl+, 打开并回到上次的分区。
            - 输入框合并为一张卡片：圆形发送按钮以填充表示可发送，附件为行首「+」，bash/steer 状态给卡片描边上色，推理与工具共用一个菜单；手动压缩移入会话菜单。
            - 文件面板改为聊天旁的整高工作台：文件树在左侧，面板打开时窗口按钮移入其头部，`\` 关闭面板。

            ### 修复

            - 跨断点缩放窗口后不再丢失面板状态或输入焦点。
            - 被 `npm test` 漏掉的测试文件现在会让测试失败，新增测试目录不会再被静默忽略。

            随包组件：pi 1.3.0、pi-web 0.10.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          gh release edit "v$version" --draft=false --latest

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap CodStaph/pi-x
  # https://github.com/CodStaph/pi-x`) on the release that was just published.
  # Runs only after `manifest` has published it, so a draft or partly failed
  # release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-x
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
