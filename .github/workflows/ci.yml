name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            # This repository's job logs need admin rights, so a failing test name
            # would be invisible from outside. Check-run annotations are public:
            # emit each failing test as one, then fail the step.
            grep -E '^✖ ' test.log | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

  # The merge boundary is measured, not remembered: `drift` recomputes each
  # fork-modified upstream file and fails when the manifest's recorded risk no
  # longer matches, `drift:sdk` ratchets the SDK facade (stage A5), and
  # `check:ownership` fails when a high-risk file has no sentinel (stage E1).
  # No `npm ci`: the scripts use Node built-ins and the manifest only.
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # `drift` diffs against the last synced upstream commit, which the
          # default single-commit checkout does not contain.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm run drift
      - run: npm run drift:sdk
      - run: npm run check:ownership
      # The agent-facing docs are the map agents navigate by; a renamed module
      # otherwise leaves a sentence pointing at nothing (stage F1).
      - run: npm run check:docs

  # The desktop shell (src-tauri) is otherwise only compiled by the release
  # workflow, so a Rust error would surface at publish time.
  desktop-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev
      # tauri-build refuses to run when a bundled resource path is missing.
      # These are the generated, gitignored outputs of `npm run desktop:prepare`;
      # empty placeholders are enough to compile and unit-test the shell. The
      # list is read from tauri.linux.conf.json, whose `bundle.resources`
      # replaces the base config's macOS list; tracked files are left alone.
      - name: Create placeholder bundle resources
        run: |
          node -e "
          const fs = require('fs');
          for (const r of require('./src-tauri/tauri.linux.conf.json').bundle.resources) {
            const p = 'src-tauri/' + r;
            if (!fs.existsSync(p)) fs.mkdirSync(p, { recursive: true });
          }"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Windows-only code (cfg(windows) blocks, the tray, taskkill/explorer paths)
  # is invisible to the Linux job and to macOS; without this job the release
  # run is the first to compile it, ~25 minutes in. 0.7.0's first attempt died
  # there on one missing import.
  desktop-shell-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Same placeholders as the Linux job, from the Windows resource list
      # (tauri.windows.conf.json replaces the base config's macOS list).
      - name: Create placeholder bundle resources
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          for (const r of require('./src-tauri/tauri.windows.conf.json').bundle.resources) {
            const p = 'src-tauri/' + r;
            if (!fs.existsSync(p)) fs.mkdirSync(p, { recursive: true });
          }"
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      # Advisory only: a high-severity finding may sit in a transitive
      # dependency that only an upstream release can fix. Read the log, do not
      # gate merges on it.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: test-results/e2e/
          retention-days: 7
